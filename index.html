<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RonRonArte</title>

    <!-- Phaser -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/3.3.0/math.min.js"></script>
</head>
<body>
<script type='module'>
    // Importa classes de cenas
    import SplashScreen from "./src/scenes/splashScreen.js";
    import Menu from "./src/scenes/menu.js";
    import Phase0 from "./src/scenes/phase0.js";
    import Tutorial from "./src/scenes/tutorial.js"
    import Phase1 from "./src/scenes/phase1.js"
    import Phase2 from "./src/scenes/phase2.js"
    import LevelSelect from "./src/scenes/levelSelect.js";
    import BasePhase from "./src/scenes/basePhase.js"

    // Configurações da cena phaser
    const config = {
        type: Phaser.AUTO,
        width: innerWidth,
        height: innerHeight,
        scene: [SplashScreen, Menu, Tutorial, Phase0, Phase1, Phase2, LevelSelect], // Adicione as cenas ao jogo
        pixelArt: true,
        scale: {
            mode: Phaser.Scale.RESIZE,
            autoCenter: Phaser.Scale.CENTER_BOTH,
        }
    };

    // Instancia do jogo
    const game = new Phaser.Game(config);
    
    // Configura o tamanho do jogo de acordo com a tela
    window.addEventListener("resize", () => {
        game.scale.resize(window.innerWidth, window.innerHeight);
    });

  </script>
</body>
</html>
