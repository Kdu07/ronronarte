<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RonRonArte</title>

    <!-- Phaser -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/3.3.0/math.min.js"></script>
</head>
<body>
<script type='module'>
    // Importa classes de cenas
    import SplashScreen from "./src/scenes/splashScreen.js"
    import OverlayScene from "./src/scenes/overlayScene.js"
    import Menu from "./src/scenes/menu.js"
    import Phase0 from "./src/scenes/phase0.js"
    import Tutorial from "./src/scenes/tutorial.js"
    import Phase1 from "./src/scenes/phase1.js"
    import Phase2 from "./src/scenes/phase2.js"
    import LevelSelect from "/src/scenes/levelSelect.js"
    import CreativeMode from "./src/scenes/creativeMode.js"
    import BasePhase from "./src/scenes/basePhase.js"

    // Configurações do Phaser
    const config = {
        type: Phaser.AUTO,
        width: 1600, // Largura base (2:1)
        height: 800, // Altura base (2:1)
        scene: [SplashScreen, Menu, Tutorial, Phase0, OverlayScene, Phase1, Phase2, LevelSelect, CreativeMode], // Cenas do jogo
        pixelArt: true,
        scale: {
            mode: Phaser.Scale.FIT,  // Mantém a proporção 2:1
            autoCenter: Phaser.Scale.CENTER_BOTH, // Centraliza o jogo na tela
            fullscreenTarget: document.documentElement // Define o alvo para tela cheia
        }
    };

    // Instancia o jogo
    const game = new Phaser.Game(config);

    // Evento para redimensionar o jogo mantendo 2:1
    window.addEventListener('resize', resizeGame);

    function resizeGame() {
        // Armazenam as dimensões da janela do navegador
        let width = window.innerWidth; 
        let height = window.innerHeight;
        let gameRatio = 2 / 1; // Proporção fixa de 2:1

        // Ajusta a largura e altura para manter a proporção
        if (width / height > gameRatio) {
            width = height * gameRatio;  // Mantém a altura e ajusta a largura
        } else {
            height = width / gameRatio;  // Mantém a largura e ajusta a altura
        }

        // Chama a função que ajusta as dimensões do jogo na tela
        game.scale.resize(width, height);
    }
  </script>
</body>
</html>
